name: Construir EstelaGis.exe (Windows)

# Construye el ejecutable portable en un Windows de GitHub y lo publica:
#   - como "artifact" descargable en cada ejecución (pestaña Actions)
#   - como Release con el .exe adjunto cuando se crea una etiqueta v*
#
# Lanzar a mano: pestaña Actions -> "Construir EstelaGis.exe (Windows)"
#   -> Run workflow.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "claude/**"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Tests unitarios
        shell: pwsh
        run: python -m pytest tests/ -q

      - name: Construir ejecutable portable
        shell: pwsh
        run: python build_portable.py

      - name: Comprobar que el .exe arranca (import del paquete)
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/EstelaGis_Portable.exe")) { throw "No se generó dist/EstelaGis_Portable.exe" }
          Get-Item dist/EstelaGis_Portable.exe | Select-Object Name, @{n="MB";e={[math]::Round($_.Length/1MB,1)}}

      - name: Publicar .exe como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: EstelaGis_Portable_Windows
          path: |
            dist/EstelaGis_Portable.exe
            dist/EstelaGis_Portable_v*.zip
          if-no-files-found: error
          retention-days: 90

      - name: Crear Release (solo etiquetas v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/EstelaGis_Portable.exe
            dist/EstelaGis_Portable_v*.zip
          generate_release_notes: true
